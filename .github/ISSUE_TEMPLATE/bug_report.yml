name: Bug report
description: Something broke while installing or running job-receipt
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with job-receipt.

        **Never paste secrets, private keys, tokens, or `.env` contents.** Strip them from logs, commands, and environment snippets before you submit.

        Paid install help uses the Commercial quote form. This form is for bugs.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What broke, including any error text with secrets, private keys, tokens, and `.env` contents removed.
      placeholder: job-receipt report exited with an error when I recorded a completed job…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What you thought would happen instead.
      placeholder: One receipt for that operator and job, and the same receipt if I run it again.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands or clicks, in order. A short example is enough. Do not include secrets, private keys, tokens, or `.env` contents.
      placeholder: |
        1. python -m venv .venv && source .venv/bin/activate
        2. pip install -e .
        3. job-receipt report --operator acme --job invoice-sync
        4. …
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Output of `python --version`. Documented floor is Python 3.10+.
      placeholder: Python 3.12.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: dropdown
    id: run_mode
    attributes:
      label: How are you running it?
      description: Offline CLI is the default. The HTTP API is optional.
      options:
        - Offline CLI
        - Local HTTP API
        - Deployed HTTP API
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the lines that show the failure. Remove secrets, private keys, tokens, and `.env` contents first.
      render: shell
      placeholder: |
        Traceback (most recent call last):
          ...
    validations:
      required: false
  - type: checkboxes
    id: no_secrets
    attributes:
      label: Secrets check
      description: Required before this issue can be filed.
      options:
        - label: I did not paste secrets, private keys, tokens, or .env contents
          required: true
